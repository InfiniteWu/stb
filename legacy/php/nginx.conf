server {
    listen 2026;
    server_name _;

    root /run/media/johnwoo/0b45c1c3-ff4d-4815-9bb8-4c9214a7d852/Repositories/Shuatibao/public;
    index index.html;

    # 日志
    access_log /var/log/nginx/shuatibao_access.log;
    error_log /var/log/nginx/shuatibao_error.log;

    # 前端路由 - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP API
    location /api/ {
        root /run/media/johnwoo/0b45c1c3-ff4d-4815-9bb8-4c9214a7d852/Repositories/Shuatibao;
        rewrite ^/api/(.*)$ /api/$1 break;
        fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Session 配置
        fastcgi_param HTTP_COOKIE $http_cookie;
    }

    # 禁止访问 data 目录
    location /data/ {
        deny all;
    }

    # 禁止访问 tools 目录
    location /tools/ {
        deny all;
    }

    # 禁止访问 api 目录下的 PHP 文件（除了 index.php）
    location ~ ^/api/(?!index\.php$) {
        deny all;
    }
}
