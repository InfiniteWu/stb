<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二哥刷题宝</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/loading.css">
</head>
<body>
    <div id="app">

        <!-- 首屏加载指示：鉴权结果返回前只显示它。
             登录页默认隐藏，避免已登录用户看到登录页一闪而过；
             由 app.js 的 showLoginPage() / showMainApp() 移除本节点。 -->
        <div id="app-loading" class="app-loading" role="status" aria-label="加载中">
            <svg class="app-loading-spinner" viewBox="0 0 40 40" aria-hidden="true">
                <circle class="app-loading-track" cx="20" cy="20" r="16"></circle>
                <circle class="app-loading-arc" cx="20" cy="20" r="16"></circle>
            </svg>
        </div>

        <!-- ══════════════════════════════════════════════════════
             登录页：整屏 12 栅格 —— 品牌展示 8 列 + 登录表单 4 列
             ══════════════════════════════════════════════════════ -->
        <div id="login-page" class="grid-12 hidden">
            <div class="login-visual">
                <div class="login-visual-bg" aria-hidden="true"></div>
                <div class="login-visual-inner">
                    <div class="login-cards">
                        <svg class="login-illustration" viewBox="0 0 720 560"
                             role="img" aria-label="题目卡片与答题结果示意图">
                            <defs>
                                <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
                                    <feDropShadow dx="0" dy="24" stdDeviation="24"
                                                  flood-color="#042f2e" flood-opacity="0.35"/>
                                </filter>
                            </defs>

                            <!-- 后层卡片 -->
                            <g transform="rotate(-7 360 300)" opacity="0.55">
                                <rect x="210" y="150" width="300" height="200" rx="20"
                                      fill="#ffffff" fill-opacity="0.08"
                                      stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>
                            </g>

                            <!-- 中层卡片 -->
                            <g transform="rotate(4 360 300)" opacity="0.78">
                                <rect x="190" y="165" width="340" height="220" rx="22"
                                      fill="#ffffff" fill-opacity="0.12"
                                      stroke="#ffffff" stroke-opacity="0.26" stroke-width="2"/>
                            </g>

                            <!-- 前层卡片：一道真实题目，第 3 行演示选中态 -->
                            <g filter="url(#cardShadow)">
                                <rect x="160" y="180" width="400" height="300" rx="24" fill="#ffffff"/>

                                <!-- 题型徽章 -->
                                <rect x="188" y="208" width="66" height="24" rx="12" fill="var(--brand-50)"/>
                                <text x="221" y="225" text-anchor="middle" font-size="12"
                                      font-family="system-ui, sans-serif" fill="var(--brand-700)">单选题</text>

                                <!-- 题干 -->
                                <rect x="188" y="250" width="344" height="10" rx="5" fill="var(--ink-300)"/>
                                <rect x="188" y="270" width="256" height="10" rx="5" fill="var(--ink-300)"/>

                                <!-- 选项 1（未选中） -->
                                <rect x="188" y="308" width="344" height="36" rx="12"
                                      fill="none" stroke="var(--ink-300)" stroke-width="2"/>
                                <circle cx="212" cy="326" r="11" fill="var(--ink-100)"/>
                                <text x="212" y="330" text-anchor="middle" font-size="11"
                                      font-family="system-ui, sans-serif" fill="var(--ink-700)">A</text>
                                <rect x="236" y="322" width="200" height="8" rx="4" fill="var(--ink-300)"/>

                                <!-- 选项 2（未选中） -->
                                <rect x="188" y="352" width="344" height="36" rx="12"
                                      fill="none" stroke="var(--ink-300)" stroke-width="2"/>
                                <circle cx="212" cy="370" r="11" fill="var(--ink-100)"/>
                                <text x="212" y="374" text-anchor="middle" font-size="11"
                                      font-family="system-ui, sans-serif" fill="var(--ink-700)">B</text>
                                <rect x="236" y="366" width="160" height="8" rx="4" fill="var(--ink-300)"/>

                                <!-- 选项 3（选中态：与设计系统的选中规范严格一致） -->
                                <rect x="188" y="396" width="344" height="36" rx="12"
                                      fill="var(--brand-50)" stroke="var(--brand-600)" stroke-width="2"/>
                                <circle cx="212" cy="414" r="11" fill="var(--brand-600)"/>
                                <text x="212" y="418" text-anchor="middle" font-size="11"
                                      font-family="system-ui, sans-serif" fill="#ffffff">C</text>
                                <rect x="236" y="410" width="220" height="8" rx="4" fill="var(--brand-200)"/>

                                <!-- 选项 4（未选中） -->
                                <rect x="188" y="440" width="344" height="36" rx="12"
                                      fill="none" stroke="var(--ink-300)" stroke-width="2"/>
                                <circle cx="212" cy="458" r="11" fill="var(--ink-100)"/>
                                <text x="212" y="462" text-anchor="middle" font-size="11"
                                      font-family="system-ui, sans-serif" fill="var(--ink-700)">D</text>
                                <rect x="236" y="454" width="140" height="8" rx="4" fill="var(--ink-300)"/>
                            </g>

                            <!-- 成功徽章 -->
                            <g transform="translate(566 404)">
                                <circle r="48" fill="none" stroke="var(--success)"
                                        stroke-opacity="0.25" stroke-width="2"/>
                                <circle r="40" fill="var(--success)"/>
                                <path d="M-16 0 L-5 11 L17 -11" fill="none" stroke="#ffffff"
                                      stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>

                            <!-- 错题标签 -->
                            <g transform="translate(84 452)">
                                <rect width="128" height="34" rx="17"
                                      fill="var(--warning)" fill-opacity="0.92"/>
                                <text x="64" y="23" text-anchor="middle" font-size="14"
                                      font-family="system-ui, sans-serif" fill="#ffffff">错题本 ×1</text>
                            </g>

                            <!-- 进度环 -->
                            <g transform="translate(604 128)">
                                <circle r="34" fill="none" stroke="#ffffff"
                                        stroke-opacity="0.18" stroke-width="8"/>
                                <circle r="34" fill="none" stroke="var(--brand-200)" stroke-width="8"
                                        stroke-linecap="round" transform="rotate(-90)"
                                        stroke-dasharray="145 214"/>
                                <text y="6" text-anchor="middle" font-size="17"
                                      font-family="system-ui, sans-serif" fill="#ffffff">68%</text>
                            </g>
                        </svg>
                    </div>

                    <div class="login-brand">
                        <h1 class="login-brand-name">二哥刷题宝</h1>
                        <p class="login-brand-tagline">智能刷题 · 高效学习</p>
                        <div class="login-brand-rule"></div>
                        <ul class="login-features">
                            <li class="login-feature">
                                <span class="login-feature-icon" data-icon="upload"></span>
                                <span>题库导入：支持 JSON 批量导入与自动统计</span>
                            </li>
                            <li class="login-feature">
                                <span class="login-feature-icon" data-icon="list-checks"></span>
                                <span>错题本：答错自动收录，连续答对自动移出</span>
                            </li>
                            <li class="login-feature">
                                <span class="login-feature-icon" data-icon="bar-chart"></span>
                                <span>练习记录：逐题回顾与正确率趋势</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="login-form-side">
                <div class="login-form-container">
                    <div class="login-form-brand">
                        <span class="login-form-brand-icon" data-icon="brand"></span>
                        <span class="login-form-brand-name">二哥刷题宝</span>
                    </div>
                    <div class="login-form-header">
                        <h2>欢迎回来</h2>
                        <p>请登录您的账户继续</p>
                    </div>
                    <form id="login-form" class="login-form">
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <input type="text" id="username" name="username" class="form-input"
                                   required placeholder="请输入用户名" autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="password">密码</label>
                            <input type="password" id="password" name="password" class="form-input"
                                   required placeholder="请输入密码" autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block btn-lg">登录</button>
                    </form>
                    <div class="login-form-footer">© 二哥刷题宝</div>
                </div>
            </div>
        </div>

        <!-- ══════════════════════════════════════════════════════
             主应用：整屏 12 栅格 —— 侧边栏 2 列 + 主内容 10 列
             ══════════════════════════════════════════════════════ -->
        <div id="main-app" class="hidden">
            <aside id="sidebar">
                <div class="sidebar-brand">
                    <div class="sidebar-brand-icon" data-icon="brand"></div>
                    <h2>二哥刷题宝</h2>
                </div>
                <nav class="sidebar-nav">
                    <div class="nav-section">
                        <div class="nav-section-title">学习</div>
                        <a href="#/" class="nav-item active" data-page="dashboard">
                            <span class="icon" data-icon="dashboard"></span>
                            <span>仪表盘</span>
                        </a>
                        <a href="#/practice/pick" class="nav-item" data-page="practice">
                            <span class="icon" data-icon="edit"></span>
                            <span>开始练习</span>
                        </a>
                        <a href="#/wrongbook" class="nav-item" data-page="wrongbook">
                            <span class="icon" data-icon="circle-x"></span>
                            <span>错题本</span>
                        </a>
                        <a href="#/sessions" class="nav-item" data-page="sessions">
                            <span class="icon" data-icon="file-text"></span>
                            <span>练习记录</span>
                        </a>
                    </div>
                    <div class="nav-section">
                        <div class="nav-section-title">管理</div>
                        <a href="#/banks" class="nav-item admin-only" data-page="banks">
                            <span class="icon" data-icon="book-stack"></span>
                            <span>题库管理</span>
                        </a>
                        <a href="#/import" class="nav-item admin-only" data-page="import">
                            <span class="icon" data-icon="upload"></span>
                            <span>导入题库</span>
                        </a>
                        <a href="#/users" class="nav-item admin-only" data-page="users">
                            <span class="icon" data-icon="users"></span>
                            <span>用户管理</span>
                        </a>
                    </div>
                </nav>
                <div class="sidebar-footer">
                    <div class="user-card">
                        <div class="user-avatar" id="user-avatar">A</div>
                        <div class="user-meta">
                            <div class="user-name" id="user-display-name">用户</div>
                            <span class="role-badge user" id="user-role">普通用户</span>
                        </div>
                    </div>
                    <a href="#/profile" class="nav-item" data-page="profile">
                        <span class="icon" data-icon="user"></span>
                        <span>个人设置</span>
                    </a>
                    <!-- 复用 .nav-item：页脚两项共用同一套尺寸（内边距/圆角/字号），
                         否则「退出登录」会因 .btn-sm 而矮一截、字号小一档。
                         它仍是 <button>（动作，不是导航），用 nav-item 只取样式；
                         initLogout() 按 id 绑定，handleRoute() 的导航高亮按 href
                         匹配，按钮没有 href，因此不会被误标为 .active。 -->
                    <button id="logout-btn" class="nav-item">
                        <span class="icon" data-icon="log-out"></span>
                        退出登录
                    </button>
                </div>
            </aside>

            <main id="main-content">
                <div class="grid-12">
                    <div id="page-container"></div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/mobile-redirect.js"></script>
    <script src="js/escape.js"></script>
    <script src="js/kdf.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
