<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二哥刷题宝</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- 登录页 -->
        <div id="login-page" class="page">
            <div class="login-visual">
                <canvas id="particles-canvas"></canvas>
                <div class="login-visual-content">
                    <h1>二哥刷题宝</h1>
                    <p>智能刷题，高效学习。<br>让每一次练习都有价值。</p>
                </div>
            </div>
            <div class="login-form-side">
                <div class="login-form-container">
                    <div class="login-form-header">
                        <h2>欢迎回来</h2>
                        <p>请登录您的账户继续</p>
                    </div>
                    <form id="login-form" class="login-form">
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <input type="text" id="username" name="username" class="form-input" required placeholder="请输入用户名">
                        </div>
                        <div class="form-group">
                            <label for="password">密码</label>
                            <input type="password" id="password" name="password" class="form-input" required placeholder="请输入密码">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block btn-lg">登录</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 主应用 -->
        <div id="main-app" class="hidden">
            <!-- 侧边栏 -->
            <aside id="sidebar">
                <div class="sidebar-brand">
                    <div class="sidebar-brand-icon">
                        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 10l3 3 3-3"/></svg>
                    </div>
                    <h2>二哥刷题宝</h2>
                </div>
                <nav class="sidebar-nav">
                    <div class="nav-section">
                        <div class="nav-section-title">学习</div>
                        <a href="#/" class="nav-item active" data-page="dashboard">
                            <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
                            <span>仪表盘</span>
                        </a>
                        <a href="#/practice/pick" class="nav-item" data-page="practice">
                            <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
                            <span>开始练习</span>
                        </a>
                        <a href="#/wrongbook" class="nav-item" data-page="wrongbook">
                            <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></span>
                            <span>错题本</span>
                        </a>
                        <a href="#/sessions" class="nav-item" data-page="sessions">
                            <span class="icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span>
                            <span>练习记录</span>
                        </a>
                    </div>
                    <div class="nav-section">
                        <div class="nav-section-title">管理</div>
                        <a href="#/banks" class="nav-item admin-only" data-page="banks">
                            <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
                            <span>题库管理</span>
                        </a>
                        <a href="#/import" class="nav-item admin-only" data-page="import">
                            <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
                            <span>导入题库</span>
                        </a>
                        <a href="#/users" class="nav-item admin-only" data-page="users">
                            <span class="icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                            <span>用户管理</span>
                        </a>
                    </div>
                </nav>
                <div class="sidebar-footer">
                    <div class="user-card">
                        <div class="user-avatar" id="user-avatar">A</div>
                        <div class="user-meta">
                            <div class="user-name" id="user-display-name">用户</div>
                            <span class="role-badge user" id="user-role">普通用户</span>
                        </div>
                    </div>
                    <a href="#/profile" class="nav-item" data-page="profile" style="margin-bottom:4px">
                        <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                        <span>个人设置</span>
                    </a>
                    <button id="logout-btn" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;color:var(--gray-400)">
                        <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                        退出登录
                    </button>
                </div>
            </aside>

            <!-- 主内容区 -->
            <main id="main-content">
                <div id="page-container"></div>
            </main>
        </div>
    </div>

    <!-- SVG 图标定义 (隐藏) -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
        <symbol id="icon-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
        <symbol id="icon-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
        <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
        <symbol id="icon-arrow-left" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
        <symbol id="icon-arrow-right" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
        <symbol id="icon-alert-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></symbol>
        <symbol id="icon-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
        <symbol id="icon-key" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></symbol>
    </svg>

    <script>
    (function(){
        var ua = navigator.userAgent;
        var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
        var isSmallScreen = window.innerWidth < 768;
        var isAlreadyMobile = /^\/mobile(\/|$)/.test(window.location.pathname);
        if ((isMobile || isSmallScreen) && !isAlreadyMobile) {
            window.location.replace("/mobile/" + window.location.hash);
        }
    })();
    </script>
    <script src="js/api.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
